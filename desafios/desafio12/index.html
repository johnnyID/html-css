<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios Tabela: parte 3</title>
    <style>

        table{
            width: 500px;
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            padding-bottom: 10px;
        }

        td, th{
            border: 1.4px solid black;
        }

    </style>
</head>
<body>
    <table>
        <caption>Notas Disciplinares</caption>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                
            </tr>
        </thead>
    </table>
</body>
</html>
