<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0; padding: 0;
            box-sizing: border-box;
        }

        html,
        body{
            height: 100dvh; width: 100vw;
        }

        body{
            display: flex;
            justify-content: center; align-items: center;
        }

        div.cont{
            position: relative;
            display: flex;
            justify-content: center; align-items: center;
            width: 62%; height: 74%;
            animation: rotation 7.2s linear infinite;
        }

        div.circle{
            width: 75px; height: 75px;
            background-color: blue;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.516), 0 0 4px rgba(0, 0, 0, 0.634);
            border-radius: 50%;
        }

        div.ellipse{
            position: absolute;
            width: 150px; height: 500px;
            border-radius: 50%;
        }

        div.ellipse::after,
        div.ellipse::before{
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            left: 1px;
            border: 2px solid;
            border-radius: inherit;
            background: linear-gradient(to top, red, blue, yellow) border-box, linear-gradient( to bottom, red blue, yellow) padding-box;
            z-index: -2;
        }

        div.ellipse::after{
            filter: blur(5px);
        }

        div#red{
            border: 3px solid red;
            transform: rotateZ(60deg);
        }

        div#green{
            border: 3px solid green;
            transform: rotateZ(-45deg);
        }

        div#blue{
            border: 3px solid blue;
            transform: rotateZ(10deg);
        }

        @keyframes rotation{
            from {transform: rotateZ(0);}
            to {transform: rotateZ(360deg);}
        }
    </style>
</head>
<body>
    <div class="cont">
        <div class="circle"></div>
        <div id="red" class="ellipse"></div>
        <div id="green" class="ellipse"></div>
        <div id="blue" class="ellipse"></div>
    </div>
</body>
</html>
