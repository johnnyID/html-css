<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,key"/>
    <title>Document</title>
</head>
<body>
    <div class="grid-container">
        <main>
            <section class="img">

            </section>
            <section class="content">
                <h1>Login</h1>
                <p>
                    Seja bem-vindo(a) à nossa página de login. Faça seu cadastro, e explore nosso site!
                </p>
                <form action="javascript.js" method="post" autocomplete="on">
                    <div class="dados">
                        <label for="email"><span class="material-symbols-outlined">account_circle</span></label>
                        <input type="email" name="email" id="email"
                        required autocomplete="email" placeholder="Insira seu e-mail" >
                    </div>
                    <div class="dados">
                        <label for="password"><span class="material-symbols-outlined">key</span></label>
                        <input type="password" name="password" id="password" placeholder="Insira sua senha" required minlength="8" maxlength="20">
                    </div>
                    <input type="submit" value="Enviar">
                    <a href="#">Esqueci minha senha</a>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
