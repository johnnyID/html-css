<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        table{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        caption{
            font-size: 1.2em;
            padding-bottom: 4px;
        }

        tr:nth-child(2n){
            background-color: lightgrey;
        }

        th{
            background-color: rgba(128, 128, 128, 0.747);
        }

        td, th{
            border: 1px solid black;
            padding: 5px;
        }
        
        td.num{
            text-align: right;
        }

        td#numtotal{
            text-align: center;
        }
        </style>
</head>
<body>
    <table>
        <caption>Dados Pessoais</caption>
        <thead>
            <tr>
                <th scope="col">Grupo</th>
                <th scope="col">Nome</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="3">Mulheres</th>
                <td>Maria Helena</td>
                <td class="num">20</td>
                <td>Enfermeira</td>
            </tr>
            <tr>
                <td>Ana Beatriz</td>
                <td class="num">25</td>
                <td>Professora</td>
            </tr>
            <tr>
                <td>Valéria Bragança</td>
                <td class="num">32</td>
                <td>Médica</td>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="3">Homens</th>
                <td>João Guilherme</td>
                <td class="num">26</td>
                <td>Engenheiro</td>
            </tr>
            <tr>
                <td>Jonathan Cardoso</td>
                <td class="num">48</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Carlos Henrique</td>
                <td class="num">34</td>
                <td>Empreendedor</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row" colspan="3">Total Pessoas</th>
                <td id="numtotal">6</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
