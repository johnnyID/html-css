<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Simples</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            height: 400px;
            /* Por padrão, as bordas utilizam uma propriedade que separa as bordas de cada elemento, sendo ele:
            [ border-collapse: separate; ] 
            Para extinguir essa separação, utilizamos o valor "collapse" na propriedade, ficando assim: 
            [ border-collapse: collapse; ] 
            */
            border-collapse: collapse;
        }

        /* Dando forma visual da tabela */
        td{
            /* Criando bordas em cada índice */
            border: 1px solid black;
            /* Alinhamento horizontal */
            text-align: center;
            /* Alinhamento vertical */
            vertical-align:  middle;
        }

        /* Em tabelas excel, por padrão os números ficam à direita  */
        td.numero{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>
        Criando Tabelas Simples
    </h1>

    <!-- tabelas simples são compostas por uma hierarquia de 4 tags, sendo elas:
    table [ table ] = tabela
        table row [ tr ]= linha da tabela
            table header [ th ] = cabeçalho da tabela
            table data [ td ] = dados da tabela
            -->

    <!-- Criando tabelas simples -->
    <!-- Corpo da Tabela -->
    <table>
        <!-- Linha da Tabela -->
        <!-- Primeira linha da tabela -->
        <tr>
            <!-- Dados da Tabela -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
            <td>D1</td>
        </tr>
        <!-- Segunda linha da tabela -->
        <tr>
            <!-- Dados da tabela -->
            <td>A2</td>
            <td>B2</td>
            <td class="numero">200</td>
            <td>D2</td>
        </tr>
        <!-- Terceira linha da tabela -->
        <tr>
            <!-- Dados da tabela -->
            <td>A3</td>
            <td>B3</td>
            <td class="numero">300</td>
            <td>D3</td>
        </tr>
        <!-- Quarta linha da tabela -->
        <tr>
            <!-- Dados da tabela -->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
            <td>D4</td>
        </tr>
    </table>
</body>
</html>
