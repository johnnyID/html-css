<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>"Validando" email e telefone</h1>
    <!-- Atributos para formulários
    [ HTML5 -> pattern="expressão-regular(RegEx)" JavaScript -> pattern="^expressão-regular(RegEx)$"] -> Serve para restringir os dados que o usuário pode inserir dentro do campo. Funciona apenas para os campos de [type="text", email e tel ].

    -->
    <form action="arquivo.js" autocomplete="on" method="get">
        <!-- [ fieldset ] -> Faz uma estrutura que agrupa todos os elementos dentro da mesma. Pode ser personalizada com CSS. -->
        <fieldset>
            <!-- [ legend ] -> Indica para o usuário o que exatamente a estrutura de agrupamento está pedindo para preencher. -->
            <legend>Dados pessoais</legend>
            <p>
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome" autocomplete="name" placeholder="Insira seu nome" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="Insira seu email" required>
            </p>
            <p>
                <label for="tel">Telefone:</label>
                <input type="tel" name="tel" id="tel" placeholder="(xx)xxxx-xxxx" pattern="\([0-9]{2}\)[0-9]{4,5}-[0-9]{4}" required>
                <!-- No atributo [ pattern=""], há duas formas para restringir números, sendo eles:

                [ \d{2} ] -> \d significa que pode inserir dígitos, {2} a quantidade que pode inserir.
                
                [ [0-9]{2} ] -> [0-9] significa que pode inserir dígitos de 0 a 9, {2} a quantidade que pode inserir
                -->
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
