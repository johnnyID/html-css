<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        h1, h2{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Utilizando output</h1>
    <h2>Exemplo com JavaScript</h2>
    <form action="arquivo.js">

        <p>
            <label for="num">Número:</label>
            <input type="range" name="num" id="num" min="0" max="10" value="5" oninput="valor.innerHTML = Number(num.value)">
            <output name="valor" id="valor">5</output>
        </p>


        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar" onclick="valor.innerHTML = Number(5)">
        </p>
    </form>
</body>
</html>
