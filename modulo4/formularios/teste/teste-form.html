<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste: Estilizando Forms</title>
    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        form{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        input{
            all: unset;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid transparent;
            box-shadow: 0px 2px 2px 2px rgba(0, 0, 0, 0.09);
            transition: border .3s ease-in-out;
        }

        input:focus{
            border:2px solid purple;
        }

        input::placeholder{
            font-size: .9rem;
        }

    </style>
</head>
<body>
    <form action="arquivo.js" method="get">
        <p>
            <input type="email" required placeholder="Insira um email">
        </p>
    </form>
</body>
</html>
