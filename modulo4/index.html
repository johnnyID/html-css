<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de iframe</title>
</head>
<body>
    <h1>Uso de iframes</h1>

    <p>
        <!-- a tag [ iframe ] é um "quadro/caixa" que permite adicionarmos um conteúdo de outra página ou recuso, como vídeos, dentro de outro site.-->
        Acessando o site do <iframe src="https://www.cursoemvideo.com" frameborder="0"></iframe> para aprender a programar
    </p>
    <p>
    <!-- Alguns site possuem uma proteção contra iframe, impossibilitando o acesso do conteúdo em site distinto -->
        Acessando o site do <iframe src="https://johnnyid.github.io/html-css/desafios/desafio10/" frameborder="0">
            <!-- Caso não apareça o conteúdo do site, é possível colocar links ou algum outro elemento. -->
            <a href="https://johnnyid.github.io"></a>
        </iframe>
    </p>
</body>
</html>
