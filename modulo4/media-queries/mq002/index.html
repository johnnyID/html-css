<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/geral.css" media="all">
    <!-- Media Features, nada mais são que características que a media deve ter para a estilização funcione, ou seja, condições. Abaixo vemos duas condições, sendo elas: orientação portrait[retrato] e landscape[paisagem] -->

    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation: landscape)">
    <title>Media Query</title>
</head>
