<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes</title>
    <style>
        
    </style>
    
</head>
<body>
    <h1>Testando JavaScript</h1>
    <p id="alteracao">Utilizando de função do JavaScript para altera um conteúdo HTML</p>
    <button type="button" onclick="myFunction()">Clique Aqui</button>
    <script>
        function myFunction(){
            document.getElementById("alteracao").innerText  = "Aqui está um exemplo de uso do JavaScript, onde criamos uma função que altera o conteúdo HTML da tag que possui o [ id='alteracao' ] para este texto. "
        };

    </script>
</body>
</html>
