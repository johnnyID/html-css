<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes</title>
    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        button{
            padding: 6px;
            background: red;
            height: 300px;
            width: 10px;
            font-size: 1px;
        }

        button:hover{
            background-color: #680000;
            border-radius: 10px;
        }

        button#direito{
            position: absolute;
            left: 98.98vw;
        }

        p{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
        }
    </style>
</head>
<body>
    <p id="abc">
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Et, voluptas. Quo error nesciunt recusandae. Voluptatibus nesciunt deserunt omnis ad iusto neque quasi sapiente rem molestiae ipsa, laudantium ea alias beatae.
    </p>
    <button type="button" onclick="myFunction(4, 6)">
        Clique aqui
    </button>
    <button id="direito" type="button" onclick="retorno()">
        Retorne
    </button>
    <script>
        function myFunction(a, b){
            let soma = a + b
            return  document.getElementById("abc").innerText = soma;
        };

        function retorno(){
            return document.getElementById("abc").innerText = "Lorem ipsum dolor sit amet consectetur adipisicing elit. Et, voluptas. Quo error nesciunt recusandae. Voluptatibus nesciunt deserunt omnis ad iusto neque quasi sapiente rem molestiae ipsa, laudantium ea alias beatae."
        }
    </script>
</body>
</html>
