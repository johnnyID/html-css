<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>get e post</title>
</head>
<body>
    <!-- O atributo [ method="get" ou method="post" ] é um atributo que, dependendo do valor passado, ajuda a omitir dados do usuário na URL, evitando um pouco vazamentos de dados, sendo assim, não é um atributo de segurança por si só, apenas auxilia.
    
    [ method="get" ] -> Os dados preenchidos no formulário são visíveis na URL do navegador. Valor padrão.

    [ method="post" ] -> Os dados preenchidos no formulário não são visíveis na URL do navegador. Utilizado para omitir dados sensíveis e evitar ligeiramente vazamentos de dados por meio da exibição dos dados na URL do navegador. -->
    <form action="arquivo.js" method="post">
        <p>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome">
        </p>
        <p>
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha">
        </p>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
